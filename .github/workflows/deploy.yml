name: Deploy

# Runs when a pull request is merged into main (a merge is a push to main).
on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --global @railway/cli
      # RAILWAY_TOKEN is a Railway project token, stored as a repository secret.
      - run: railway up --ci --service onitama
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
